# A workspace where the plugin SDK depends on the core, and dev-depends on another core-role crate.
# Neither edge is one its role allows, so the crate gate must refuse both, naming both crates and
# their roles.
[workspace]
members = ["plugin-sdk", "core", "tool"]
resolver = "3"

# Every member here inherits these lints, so only the role rule under test can fail the gate.
[workspace.lints.clippy]
too_many_lines = "warn"
