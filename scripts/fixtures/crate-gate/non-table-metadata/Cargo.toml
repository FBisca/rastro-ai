# A workspace with one member whose [package.metadata] rastro value is a string, not a table, so it
# declares no role at all. The crate gate must refuse it, naming the crate, instead of failing with a
# parser error that names nothing.
[workspace]
members = ["fixture-textual-metadata"]
resolver = "3"

# Every member here inherits these lints, so only the role rule under test can fail the gate.
[workspace.lints.clippy]
too_many_lines = "warn"
