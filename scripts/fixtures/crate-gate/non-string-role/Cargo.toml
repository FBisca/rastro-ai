# A workspace with one member whose role is a number rather than a role name. The crate gate must
# refuse it, naming the crate, instead of failing with a parser error that names nothing.
[workspace]
members = ["fixture-numbered"]
resolver = "3"

# Every member here inherits these lints, so only the role rule under test can fail the gate.
[workspace.lints.clippy]
too_many_lines = "warn"
