name: CI
on: [push, pull_request]

permissions:
  contents: read

# A new push supersedes the run before it on the same branch: macOS runners are scarce account-wide,
# and runs for stale commits queued every newer one behind them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Pull requests and branch pushes run on ubuntu only, so they are not queued behind the macOS
        # runners; main runs both, so a macOS-only failure still surfaces on the merge that caused it.
        os: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
          components: rustfmt, clippy
      - uses: taiki-e/install-action@nextest
        with:
          # Pinned: recording is experimental, and scripts/nextest-config.test.sh asserts the timeout wording.
          tool: nextest@0.9.151
      - run: scripts/affected-tests.test.sh
      - run: scripts/crate-gate.sh
      - run: scripts/crate-gate.test.sh
      - run: scripts/ignored-tests.sh
      - run: scripts/ignored-tests.test.sh
      - run: scripts/nextest-config.test.sh
      - run: python3 scripts/test_spec_coverage.py
      - run: python3 scripts/spec_coverage.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace
        env:
          # Records the run, so a red run's failures rerun with `cargo nextest run --rerun latest`.
          NEXTEST_USER_CONFIG_FILE: .config/nextest-user.toml
