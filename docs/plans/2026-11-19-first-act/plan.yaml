schema: plan/2
slug: first-act
goal: >-
  An agent in any harness proposes a Linear issue through Rastro, the owner accepts it in one step, and
  Rastro creates it exactly once, keeps its justification out of Linear and inside the source's scope,
  answers why it ran, undoes it only when that is safe, and a single idempotent `rastro tick` keeps sources
  fresh and finishes or retries unfinished runs.
spec: docs/specs/actions.md
archive: promote

requirements:
  added:
    - title: Action providers are a plugin role
      shall: >-
        The host SHALL load a plugin of kind `action_provider` that declares its actions and no evidence
        permission, SHALL refuse any other plugin that declares actions, and SHALL offer only the actions
        installed providers declare.
      scenarios:
        - id: S1
          name: an action provider loads
          when: an `action_provider` manifest declares the action `linear.create_issue` and no `submit` permission
          then: the host loads it and `rastro actions propose linear.create_issue` is accepted
        - id: S2
          name: a provider that also submits evidence is refused
          when: an `action_provider` manifest declares an action and a `submit` permission
          then: the host refuses the plugin naming it and the `submit` permission, and no action is offered
        - id: S3
          name: an action no provider declares is refused
          when: an agent proposes an action that no installed provider declares
          then: the command fails naming the action, and the queue holds no new item

    - title: Each action declares its reach and reversibility
      shall: >-
        An action provider's manifest SHALL declare, for each action, its reach and its reversibility, and the
        host SHALL refuse the plugin when either is missing.
      scenarios:
        - id: S27
          name: an action without its risk is refused
          when: an `action_provider` manifest declares an action with no reversibility
          then: the host refuses the plugin naming the action and `reversibility`, and no action is offered

    - title: An agent proposes an action
      shall: >-
        `rastro actions propose` SHALL record one pending action proposal bound to the source it writes to and
        that source's scope, carrying the action, its fields, the proposer's why and the cited claims, SHALL
        list it in the queue, and SHALL run nothing.
      scenarios:
        - id: S4
          name: a proposal waits in the queue
          when: an agent runs `rastro actions propose linear.create_issue --title T --why W` with `default_team` set
          then: >-
            `rastro queue` lists one action proposal with a content-addressed id naming the action, the title,
            the default team, the owner as assignee, the why and the Linear source with its scope, and the fake
            Linear server has received no request
        - id: S5
          name: a proposal without a why is refused
          when: an agent proposes an action without `--why`
          then: the command fails naming `--why`, and nothing is recorded
        - id: S6
          name: a citation the source's scope cannot see is refused
          when: an agent proposes a work-scoped Linear action with `--cite` naming a claim visible only in a personal scope
          then: the command fails naming the claim id and the scope `work`, and nothing is recorded

    - title: A proposal names its team
      shall: >-
        An action proposal for `linear.create_issue` SHALL take its team from `--team`, else from
        `[actions.linear] default_team`, and SHALL be refused when neither names one.
      scenarios:
        - id: S7
          name: no team anywhere is refused
          when: an agent proposes `linear.create_issue` without `--team` and the config has no `default_team`
          then: the command fails naming `--team` and `[actions.linear] default_team`, and nothing is recorded

    - title: A duplicate title is flagged
      shall: >-
        An action proposal for `linear.create_issue` SHALL name each open observed Linear issue visible in its
        scope whose title equals its own exactly, and SHALL stay in the queue.
      scenarios:
        - id: S8
          name: an open issue with the same title is named
          when: an observed Linear issue in an open state has exactly the proposal's title
          then: the queue item reads "possible duplicate of" that issue's identifier, and accepting it is still allowed
        - id: S9
          name: a closed issue with the same title is not
          when: the only observed Linear issue with the proposal's title is Done or Canceled
          then: the queue item carries no duplicate mark

    - title: Accepting a proposal runs the action once
      shall: >-
        `rastro queue accept` on an action proposal SHALL record the accept intent and one Action run holding
        a random issue id in a single transaction, and the run SHALL create at most one issue however often it
        is executed.
      scenarios:
        - id: S10
          name: an accepted proposal creates the issue
          when: the owner accepts an action proposal
          then: >-
            the fake Linear server receives exactly one issue create with the proposal's title, team and
            assignee, and `rastro actions` lists the run `done` with the issue's identifier and URL
        - id: S11
          name: a repeated execution creates nothing new
          when: the same Action run is executed a second time after its issue was created
          then: the fake Linear server still holds one issue for the run, and the run reads `done` once

    - title: Nothing about Rastro reaches a source
      shall: >-
        The request an action sends to an outside system SHALL carry only the content written for that
        system, and never a Rastro id, link, why, citation, footer, label or marker.
      scenarios:
        - id: S12
          name: the Linear payload is exactly the issue
          when: an accepted proposal with a why and two cited claims creates its issue
          then: >-
            the issue create the fake Linear server receives holds exactly the title, description, team and
            assignee the owner accepted, each unchanged, plus the run's random issue id, and no other field

    - title: An interrupted run is finished by tick
      shall: >-
        `rastro tick` SHALL execute each accepted Action run that is neither done nor failed, SHALL look the
        run's issue id up before creating it, and SHALL let only one process execute a run at a time.
      scenarios:
        - id: S32
          name: a run cut off before sending is executed
          when: an accepted run is recorded and the process stops before any request is sent, then tick runs
          then: the fake Linear server receives one issue create for the run, and the run reads `done`
        - id: S33
          name: a lost response is reconciled
          when: the fake Linear server created the run's issue but the response never arrived, then tick runs
          then: tick finds the issue by the run's id, sends no second create, and the run reads `done` with its identifier
        - id: S34
          name: two executors make one issue
          when: an accept and a tick execute the same run at the same time
          then: the fake Linear server receives one issue create, and the other executor leaves the run untouched

    - title: The owner edits or rejects an action proposal
      shall: >-
        `rastro queue edit` on an action proposal SHALL accept it with the owner's changes to its title,
        description, team or assignee, as edit accepts a commitment proposal, and `rastro queue reject` SHALL
        close it with no run.
      scenarios:
        - id: S13
          name: an edited proposal runs as edited
          when: the owner edits an action proposal's title
          then: >-
            the fake Linear server receives one issue create with the edited title, the run reads `done`, and the
            queue no longer lists the item
        - id: S14
          name: a rejected proposal runs nothing
          when: the owner rejects an action proposal
          then: the fake Linear server receives no request, and `rastro actions` lists no run for it

    - title: The owner reads why an action ran
      shall: >-
        `actions` SHALL be a catalog read on the CLI and MCP that returns each run with its status, and for one
        run its proposal, why, cited claims with their evidence, accept intent, level, cell, reach and
        reversibility, visible only in the scope of the source the run writes to.
      scenarios:
        - id: S15
          name: a run explains itself
          when: an agent calls the MCP tool `actions` with a run id after the owner accepted a cited proposal
          then: >-
            the result holds the action, its fields, the why, each cited claim with its evidence, the accept
            intent's id and time, level `propose`, the cell (action and team), reach `others see it`,
            reversibility `can be undone` and status `done`
        - id: S16
          name: another scope sees neither proposal nor run
          when: an MCP server launched with a scope other than the Linear source's reads `queue` and `actions`
          then: the action proposal and its run are absent, and both reads still succeed

    - title: The owner undoes an action
      shall: >-
        `rastro actions undo <run>` SHALL delete the issue a done run created and record an undo intent, and
        SHALL refuse when someone other than the owner commented on or edited the issue since it was created.
      scenarios:
        - id: S17
          name: an untouched issue is deleted
          when: the owner undoes a done run whose issue nobody else has changed
          then: >-
            the fake Linear server receives one delete for that issue, and `rastro actions` lists the run
            `undone` with the undo intent's id and time
        - id: S18
          name: a colleague's comment blocks undo
          when: the owner undoes a done run whose issue another user has commented on
          then: the command fails naming that user and the comment, no delete is sent, and nothing is recorded
        - id: S29
          name: a colleague's edit blocks undo
          when: the owner undoes a done run whose issue another user has edited
          then: the command fails naming that user and the edit, no delete is sent, and nothing is recorded

    - title: Undo deletes only what it can verify
      shall: >-
        `rastro actions undo` SHALL read the issue's full comment and change history before deleting, and SHALL
        refuse when that history cannot be read whole or the run is not done.
      scenarios:
        - id: S19
          name: a run that is not done cannot be undone
          when: the owner undoes a run that is `failed` or already `undone`
          then: the command fails naming the run's status, and nothing is recorded
        - id: S30
          name: unreadable history refuses
          when: the fake Linear server fails the issue's history read on any page
          then: the command fails saying the history could not be checked, no delete is sent, and nothing is recorded
        - id: S31
          name: the owner's own changes do not block
          when: the owner undoes a done run whose issue only the owner has edited and commented on
          then: the fake Linear server receives one delete, and the run reads `undone`

    - title: Undo is safe to repeat
      shall: >-
        `rastro actions undo` SHALL record the run `undone` when its issue is already deleted, without
        sending a second delete.
      scenarios:
        - id: S35
          name: a lost delete response
          when: the delete reached the fake Linear server but its response was lost, and the owner runs undo again
          then: the command succeeds without a second delete, and the run reads `undone` with one undo intent

    - title: One tick syncs every stale source
      shall: >-
        `rastro tick` SHALL sync each source whose last complete check is older than its freshness rule,
        skip the fresh ones, and exit at once when another tick holds the lock.
      scenarios:
        - id: S20
          name: only stale sources sync
          when: tick runs with one source past its freshness rule and one within it
          then: one new run is recorded for the stale source and none for the fresh one
        - id: S21
          name: a concurrent tick does nothing
          when: a second tick starts while the first still holds the tick lock
          then: the second exits 0 saying a tick is already running, and records no run
        - id: S22
          name: one failed source does not stop the others
          when: tick syncs two stale sources and the first one's sync fails
          then: the second source still syncs, and tick exits non-zero naming the failed source

    - title: A failed run is retried by tick, then left failed
      shall: >-
        An Action run whose execution fails SHALL read `failed` with its error, and `rastro tick` SHALL retry
        it until it has made 3 attempts, then leave it failed.
      scenarios:
        - id: S23
          name: a failed create is recorded
          when: the fake Linear server returns an error to the issue create of an accepted proposal
          then: >-
            the accept command reports the error and exits non-zero, the accept intent stays recorded, and
            `rastro actions` lists the run `failed` with the error and 1 attempt
        - id: S24
          name: tick retries a failed run
          when: tick runs over a failed run with fewer than 3 attempts and the fake Linear server now succeeds
          then: the server holds one issue for the run, and the run reads `done`
        - id: S25
          name: three attempts are the end
          when: tick runs over a failed run that has made 3 attempts
          then: the fake Linear server receives no request, and the run stays `failed` with 3 attempts

    - title: A real issue goes through Rastro
      shall: >-
        The owner SHALL have one real Linear issue created through a Rastro proposal from an in-session agent
        before the slice is done.
      scenarios:
        - id: S26
          name: switch day
          when: an in-session agent proposes the owner's next real Linear issue and the owner accepts it
          then: the issue exists in Linear with exactly the accepted title and description

