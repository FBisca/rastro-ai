schema: plan/2
slug: meeting-task-template
goal: Meeting imports run through the first locally replaceable task template without teaching the core task runner meeting logic or changing the CLI and MCP workflow.
spec: docs/specs/meetings.md

requirements:
  added:
    - title: Task templates run without domain logic in the core runner
      shall: Core SHALL execute task templates without containing plugin-specific instructions, validation or exclusion rules, or runner branches keyed on the template ID.
      scenarios:
        - id: S1
          when: A synthetic blog template with fields and text checks different from the meeting template is passed to the task runner
          then: The unchanged runner evaluates the blog declarations and returns the validated blog-shaped result.
        - id: S2
          when: An adapter cannot enforce a control required by the core floor or the task template
          then: The run is refused before the adapter receives any transcript text.
        - id: S3
          when: A valid candidate matches a declared exclusion rule
          then: The candidate is counted as excluded without causing a retry.
    - title: Meeting imports select the bundled or owner-configured task template
      shall: A meeting import SHALL use the bundled meeting task template unless the owner explicitly selects a compatible local replacement.
      scenarios:
        - id: S4
          when: The owner imports a supported transcript using existing adapter configuration and no template override
          then: The bundled template produces the existing CLI and shared MCP meeting hypotheses from the validated candidates.
        - id: S5
          when: The owner imports with a compatible local template selected and an unchanged adapter binding
          then: The adapter receives the selected template's rendered instructions.
        - id: S6
          when: The selected local template cannot be loaded or does not meet the meeting input and result contract
          then: The import reports the selected template error without calling the adapter or falling back.
  modified:
    - title: Replay needs no model call and forgetting removes what was retained
      shall: Replay SHALL validate recorded output without calling a model using the saved contract or the bundled legacy contract for old runs, with forgetting removing all retained replay data for that meeting.
      scenarios:
        - id: S7
          when: A recorded meeting run is replayed after its original template has changed or been uninstalled
          then: Replay validates the recorded output using the saved contract without calling a model.
        - id: S8
          when: A meeting run from before template contracts were recorded is replayed with a different template currently selected
          then: Replay uses the bundled legacy rules without calling a model.
        - id: S9
          when: The owner forgets a meeting that has a saved contract
          then: Its retained spans, recorded output and saved contract are removed.
tickets:
  - id: T1
    delivers: Run declarative rules for synthetic tasks behind the generic judgment boundary.
    satisfies: [S1, S2, S3]
    paths: [crates/rastro-plugin-sdk/, crates/rastro-core/src/host/, crates/rastro-core/tests/]
    size: regular
    difficulty: complex
    risk: [security]
  - id: T2
    delivers: Run meeting imports with the bundled package and retain stable, forgettable replay contracts.
    satisfies: [S4, S7, S8, S9]
    paths: [crates/rastro-core/src/meeting.rs, crates/rastro-storage-sqlite/src/meeting.rs, crates/rastro-storage-sqlite/migrations/, crates/rastro-cli/tests/meeting.rs, docs/decisions/plugins.md]
    size: regular
    difficulty: complex
    blocked_by: [T1]
    risk: [migration, state]
  - id: T3
    delivers: Honor an explicit compatible local template without changing the adapter binding.
    satisfies: [S5, S6]
    paths: [crates/rastro-core/src/lib.rs, crates/rastro-core/src/meeting.rs, crates/rastro-cli/tests/meeting.rs]
    size: regular
    difficulty: complex
    blocked_by: [T2]
    risk: [security]
