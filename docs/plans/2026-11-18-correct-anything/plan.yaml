schema: plan/2
slug: correct-anything
goal: >-
  The owner confirms, retracts or fixes any claim in the projection from the CLI, the correction carries
  through to the claims and queue items that rest on it, and `about` and `why` answer as of a past time.
spec: docs/specs/corrections.md
archive: promote

requirements:
  added:
    - title: The owner confirms a claim
      shall: >-
        `claim confirm` SHALL record one `confirm` intent on a claim the owner can see, bound to the
        lifecycle state of the revision the owner saw, and the claim SHALL then read `confirmed`.
      scenarios:
        - id: S1
          name: a confirmed claim reads confirmed
          when: the owner confirms an observed claim naming its current revision
          then: >-
            `about` shows the claim with status `confirmed`, and `why` lists a confirmation justification
            citing the intent's id and time
        - id: S2
          name: a stale revision is a conflict
          when: the owner confirms a claim naming a revision that is no longer the claim's current one
          then: >-
            the command fails naming the claim and its current revision, and no intent is recorded
        - id: S3
          name: a confirmed member leads its group
          when: a merged Person's group holds a confirmed member and an observed member for one predicate
          then: the group lists the confirmed member before the observed one

    - title: The owner retracts a claim
      shall: >-
        `claim reject` SHALL record one `reject` intent on a claim the owner can see, and the claim SHALL
        then be left out of every current read in every scope that can see a justification of it.
      scenarios:
        - id: S4
          name: a retracted claim leaves about
          when: the owner rejects an observed claim naming its current revision
          then: >-
            `about` no longer lists the claim, and `why` on its id shows status `retracted` with the
            reject intent
        - id: S5
          name: a scoped read hides it too
          when: a claim is rejected and an MCP server launched with a scope that sees it reads `about`
          then: the claim is absent from that scoped result
        - id: S6
          name: an owner link goes through undo
          when: the owner rejects a held_by or same_as claim that an owner `link` intent made
          then: >-
            the command fails naming `identity undo` and the link intent, and no intent is recorded

    - title: The owner fixes a claim's object
      shall: >-
        `claim edit` SHALL record one `edit` intent that retracts the target claim and asserts a claim with
        the same subject and predicate and the new object, justified by that intent alone.
      scenarios:
        - id: S7
          name: the fixed claim replaces the old one
          when: the owner edits a claim's object
          then: >-
            `about` lists a claim with the new object and not the old one, and `why` on the new claim cites
            the edit intent as its only justification
        - id: S8
          name: an object outside the range is refused
          when: the new object breaks the predicate's range
          then: the command fails naming the predicate and its range, and no intent is recorded

    - title: A retraction ends only what rests on it
      shall: >-
        A retraction SHALL end every derivation whose premise it retracts, and SHALL leave a claim standing
        while another justification of it is live.
      scenarios:
        - id: S9
          name: an automatic link loses its premise
          when: the owner rejects the verified-email claim an automatic held_by link rests on
          then: '`about` on the Person no longer lists that account as held'
        - id: S10
          name: an independent justification keeps the claim
          when: the rejected premise's automatic link is also justified by an owner `link` intent
          then: '`about` still lists the account as held, justified by the owner link'
        - id: S11
          name: a commitment's anchor takes its slots
          when: the owner rejects the anchor claim of an accepted commitment
          then: >-
            every slot claim that only that anchor justified is absent from `about`, and a slot with its own
            observed justification is still listed

    - title: A retracted commitment is no longer known
      shall: >-
        The queue's known-first check SHALL NOT count a retracted claim's statement as known, and SHALL mark a
        proposal that expresses it as earlier retracted.
      scenarios:
        - id: S12
          name: new evidence proposes it again
          when: >-
            an accepted commitment's claims are retracted and a pending proposal expresses the same statement
          then: the queue shows that proposal, marked earlier retracted, instead of counting it as known

    - title: A correction follows its claim's lifecycle state
      shall: >-
        A retraction or confirmation SHALL hold while the claim's lifecycle fingerprint is the one it was
        bound to; a changed fingerprint SHALL lapse a retraction and leave a confirmation standing but stale.
      scenarios:
        - id: S13
          name: a lapsed retraction returns marked
          when: a retracted claim's bound occurrence closes
          then: >-
            `about` lists the claim again with its evidence-derived status, marked earlier retracted
        - id: S14
          name: new corroboration keeps it retracted
          when: a second occurrence from another source corroborates a retracted claim
          then: '`about` still leaves the claim out'
        - id: S15
          name: a confirmation goes stale
          when: the only evidence justification of a confirmed claim ends
          then: >-
            `about` lists the claim as `confirmed`, marked stale, and `why` shows the ended justification in
            its history

    - title: A lapsed or stale correction asks the owner
      shall: >-
        The queue SHALL hold one question for each lapsed retraction and each stale confirmation the caller
        can see, and answering it SHALL record one intent.
      scenarios:
        - id: S16
          name: the queue asks
          when: a retraction lapses
          then: >-
            the queue holds one question naming the claim, its current status and the earlier reject intent
        - id: S17
          name: yes retracts it again
          when: the owner answers that question yes
          then: >-
            `about` leaves the claim out again, and the question is gone from the queue on every surface

    - title: The latest intent wins, and undo removes only its own
      shall: >-
        A claim's correction status SHALL come from its latest valid intent, and `claim undo` SHALL remove only
        the named intent's contribution.
      scenarios:
        - id: S18
          name: a confirm reverses a retraction
          when: the owner confirms a claim they had rejected
          then: '`about` lists the claim as `confirmed`'
        - id: S19
          name: undo restores the earlier state
          when: the owner undoes a reject issued after a confirm on the same claim
          then: '`about` lists the claim as `confirmed`, and `why` shows the undone reject in its history'

    - title: Corrections replay at rebuild
      shall: >-
        `claims rebuild` SHALL replay every correction intent so that the rebuilt projection equals the
        incremental one.
      scenarios:
        - id: S20
          name: rebuild keeps corrections
          when: the projection holds confirmed, retracted and fixed claims and the owner runs `claims rebuild`
          then: >-
            `about` and `why` return the same claim ids and statuses as before the rebuild

    - title: Reads as of a past time
      shall: >-
        `about` and `why` with `as_of` SHALL reconstruct the answer from the evidence captured by that time and
        the intents issued by it, under today's rules, and SHALL say so.
      scenarios:
        - id: S21
          name: the answer before a correction
          when: the owner reads `about` as of a time before they rejected a claim
          then: >-
            the claim is listed with its status before the rejection, and the result states it is a
            reconstruction naming the extractor and vocabulary versions it used
        - id: S22
          name: a source not read yet is named
          when: '`as_of` is earlier than any evidence captured from a source the entity has claims from'
          then: >-
            the result names that source as not yet read at that time, instead of answering with no claims
        - id: S23
          name: MCP answers the same
          when: an agent calls the MCP `about` tool with `as_of`
          then: it returns the same claims and statuses as the CLI with the same `as_of`

    - title: Corrections are CLI writes in the catalog
      shall: >-
        The operation catalog SHALL define `claim.confirm`, `claim.reject`, `claim.edit` and `claim.undo` as
        CLI-only writes, and the MCP server SHALL list none of them.
      scenarios:
        - id: S24
          name: MCP stays read-only
          when: an agent lists the MCP server's tools
          then: >-
            no correction write is listed, and `about` and `why` accept `as_of` in their input schemas

    - title: Corrections serve a real morning
      shall: >-
        The owner SHALL correct their real `about me` from the CLI on the switch day, using the corrections
        instead of remembering what is wrong.
      scenarios:
        - id: S25
          name: switch day
          when: the morning after the last code ticket merges, the owner reads `about me` on their own store
          then: >-
            they reject or edit at least one wrong claim and confirm one, and the next `about me` shows each
            change, recorded in `docs/specs/corrections.md` under Switch day

