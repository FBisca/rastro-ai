schema: plan/2
slug: linear-ids
goal: >-
  An issue an Action run creates reaches Linear under the Linear ids of its team and assignee, so a real
  create succeeds, while the run keeps the team key and assignee as the owner and the rule wrote them.
spec: docs/specs/actions.md
archive: promote

requirements:
  added:
    - title: A created issue names Linear's own ids
      shall: >-
        The Linear action provider SHALL send an issue create with the Linear id of the team the run's team
        key names and, for the assignee `me`, the Linear user id of the key's owner.
      scenarios:
        - id: S1
          name: the team key is sent as its team's id
          when: a run with team `H` executes against a fake Linear server that refuses a team that is not an id
          then: the issue create the fake server receives carries team H's Linear id as its team
        - id: S2
          name: the assignee me is sent as the owner's id
          when: a run with assignee `me` executes against a fake Linear server that refuses an assignee that is not an id
          then: the issue create the fake server receives carries the owner's Linear user id as its assignee
        - id: S3
          name: an unknown team key creates nothing
          when: a run's team key names no team the fake Linear server holds
          then: the fake server receives no issue create, and the run's error names the team key

tickets:
  - id: T1
    delivers: >-
      The Linear provider resolves the run's team key and the assignee `me` to Linear ids just before the
      create, and the fake Linear server holds teams and refuses a team or assignee that is not an id.
    satisfies: [S1, S2, S3]
    paths:
      - crates/rastro-action-linear/
      - crates/rastro-cli/tests/support/linear_api.rs
      - crates/rastro-cli/tests/actions_accept.rs
      - crates/rastro-cli/tests/actions_grace.rs
      - crates/rastro-cli/tests/actions_edit.rs
      - crates/rastro-cli/tests/actions_linear_ids.rs
    size: regular
    difficulty: complex
    risk: [external]
