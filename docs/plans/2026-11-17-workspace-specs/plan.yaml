schema: plan/2
slug: workspace-specs
goal: >-
  Every requirement in rastro's specs is a titled SHALL requirement with a test that names it, CI fails
  when a requirement has no test or a test names none, and an archived plan writes its changes into its
  spec.
spec: docs/specs/workspace/specs.md
archive: promote

requirements:
  added:
    - title: Every requirement names its tests
      shall: >-
        The spec gate SHALL fail when a `### Requirement:` title in any spec under `docs/specs/` has no test
        tagged `// spec: <Title>`, or a tag in any workspace `.rs` file names no title.
      scenarios:
        - id: S1
          name: an untested requirement fails
          when: a spec holds a title that no test is tagged with
          then: the spec gate exits non-zero naming the title and its spec file
        - id: S2
          name: a tag naming nothing fails
          when: a `// spec:` tag names a title no spec holds
          then: the spec gate exits non-zero naming the tag's file, line and title
        - id: S3
          name: every test and every spec is read
          when: >-
            a tag sits in a `src/` `#[cfg(test)]` module and its title in a spec inside a subfolder of
            `docs/specs/`, and a stray tag sits under `target/`
          then: the spec gate counts the first as covering its title and ignores the one under `target/`

    - title: Specs hold only titled requirements
      shall: >-
        A spec SHALL state its requirements only as `### Requirement:` blocks, each one SHALL sentence with
        `#### Scenario:` WHEN/THEN bullets, and SHALL hold no `- **R<n>**` requirement bullet or coverage table.
      scenarios:
        - id: S4
          name: a legacy requirement fails
          when: a spec holds an `- **R<n>**` bullet or a `## Coverage` heading
          then: the spec gate exits non-zero naming the file and line
        - id: S5
          name: the product specs are titled
          when: the spec gate runs over claims, commitments, evidence, identity, meetings and surfaces
          then: >-
            it passes, each former R-bullet now a titled requirement whose proving tests carry its tag

tickets:
  - id: T1
    delivers: >-
      A CI spec gate holds every titled requirement to a tagged test and every tag to a title, across every
      `.rs` file and every spec under `docs/specs/`; plans archive by promote; CONTRIBUTING.md explains
      the loop
    satisfies: [S1, S2, S3]
    paths:
      - scripts/spec_coverage.py
      - scripts/test_spec_coverage.py
      - .github/workflows/ci.yml
      - .orchestrate/config.yaml
      - AGENTS.md
      - docs/development.md
      - CONTRIBUTING.md
    size: regular
    difficulty: simple

  - id: T2
    delivers: claims.md's R-bullets become titled requirements, its Coverage tables go, its tests carry their tags
    satisfies: [S5]
    paths: [docs/specs/claims.md, crates/]
    size: regular
    difficulty: simple
    blocked_by: [T1]

  - id: T3
    delivers: evidence.md's R-bullets become titled requirements, its Coverage tables go, its tests carry their tags
    satisfies: [S5]
    paths: [docs/specs/evidence.md, crates/]
    size: regular
    difficulty: simple
    blocked_by: [T1]

  - id: T4
    delivers: identity.md's R-bullets become titled requirements, its Coverage tables go, its tests carry their tags
    satisfies: [S5]
    paths: [docs/specs/identity.md, crates/]
    size: regular
    difficulty: simple
    blocked_by: [T1]

  - id: T5
    delivers: surfaces.md's R-bullets become titled requirements, its Coverage tables go, its tests carry their tags
    satisfies: [S5]
    paths: [docs/specs/surfaces.md, crates/]
    size: regular
    difficulty: simple
    blocked_by: [T1]

  - id: T6
    delivers: >-
      commitments.md's and meetings.md's R-bullets become titled requirements, their Coverage tables go,
      their tests carry their tags
    satisfies: [S5]
    paths: [docs/specs/commitments.md, docs/specs/meetings.md, crates/]
    size: regular
    difficulty: simple
    blocked_by: [T1]

  - id: T7
    delivers: The spec gate refuses an `- **R<n>**` bullet or a `## Coverage` table in any spec
    satisfies: [S4]
    paths: [scripts/spec_coverage.py, scripts/test_spec_coverage.py]
    size: small
    difficulty: simple
    blocked_by: [T2, T3, T4, T5, T6]
