schema: plan/2
slug: proposal-standing
goal: >-
  The owner reading one action run, on the CLI or MCP, sees whether its proposal still waits in the queue
  and, when it does not, what took it out, decided by the same rule `rastro queue` reads.
spec: docs/specs/actions.md
archive: promote

requirements:
  added:
    - title: A run says where its proposal stands in the queue
      shall: >-
        `actions` with a run id, on the CLI and MCP, SHALL state whether the run's proposal waits in
        `rastro queue` and, when it does not, whether the owner's answer or a run's status took it out,
        agreeing with what `rastro queue` lists.
      scenarios:
        - id: S1
          name: a returned Act's proposal waits
          when: a rule's pending Act reads `returned` after its re-check fails, and the owner reads that run with `rastro actions show` and the MCP tool `actions`
          then: both reads state that the proposal waits in the queue, and `rastro queue` lists it
        - id: S2
          name: a done Act's proposal was taken out by its run
          when: a rule's Act reads `done` after `rastro tick` creates its issue, and the owner reads that run with `rastro actions show` and the MCP tool `actions`
          then: both reads state that the proposal left the queue because that run reads `done`, and `rastro queue` does not list it
        - id: S3
          name: an accepted proposal was taken out by the owner
          when: the owner accepts an action proposal with `rastro queue accept` and reads the run it started with `rastro actions show` and the MCP tool `actions`
          then: both reads state that the proposal left the queue because of the owner's accept, naming the accept intent's id

tickets:
  - id: T1
    delivers: >-
      Core decides where a proposal stands from its runs and the owner's intents, with the same rule the
      queue read uses; the run explanation carries it as a field, `actions show` prints it as one line,
      and the operations schema holds the new field.
    satisfies: [S1, S2, S3]
    paths:
      - crates/rastro-core/src/queue/mod.rs
      - crates/rastro-core/src/queue/answers.rs
      - crates/rastro-core/src/actions/why.rs
      - crates/rastro-cli/src/main.rs
      - schema/operations-v2.schema.json
      - crates/rastro-cli/tests/actions_read.rs
      - crates/rastro-cli/tests/actions_standing.rs
    size: regular
    difficulty: complex
