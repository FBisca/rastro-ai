schema: plan/1
slug: answers-i-can-read
goal: The owner preps standup from `about me` over MCP, reading cited labels and state instead of bare ids, and sees what `rastro sync` is doing while it runs, including a warning when a renamed source re-reads its window.
spec: docs/specs/claims.md
outcome: [S1, S9, S13, S16, S18, S20]

scenarios:
  # Labels
  - id: S1
    when: about returns a claim whose subject or object is a GitHub issue or PR with `/title` evidence at its location
    then: that side's label carries the title text, `url` = the location, the evidence id, `field` `/title`, `captured_at`, `trust_class` untrusted content and `clipped` false
    evidence:
      check: CARGO_TARGET_DIR="$XDG_CACHE_HOME/rastro-eec-target" cargo test -p rastro-cli --test labels_oracle S1_
      baseline: fail
      oracle: [labels_oracle.rs.oracle]
      place: crates/rastro-cli/tests/
      timeout: 2400
  - id: S2
    when: why explains a claim
    then: its subject and object carry the same labels as in about
  - id: S3
    when: the entity is a Linear issue, or a Linear user
    then: a Linear issue's label comes from `/title` with `url` null; a Linear user's label comes from `/name`, not `/displayName`
  - id: S4
    when: the entity is a repository, a comment, a GitHub account or a Person
    then: its label is null
  - id: S5
    when: a title is longer than 200 chars, with a multibyte char across the cut
    then: the label holds at most 200 whole chars and `clipped` is true
  - id: S6
    when: an entity has several title observations
    then: the label is the one with the latest `captured_at`, ties broken by the higher evidence id
  - id: S7
    when: rastro mcp --scope <s> hides the only title evidence of an entity, or a visible copy exists in another scope
    then: the label is null and the call still succeeds; with a visible copy in another scope, that copy is used
  - id: S8
    when: labels are added
    then: claims, supports and revisions are unchanged, and about "<a title's text>" doesn't resolve to the entity
  - id: S9
    when: an entity has a current observed state claim (`code:state` or `tracker:state`), or has none
    then: label.state holds its value; with none, label.state is null
    evidence:
      check: CARGO_TARGET_DIR="$XDG_CACHE_HOME/rastro-eec-target" cargo test -p rastro-cli --test labels_oracle S9_
      baseline: fail
      oracle: [labels_oracle.rs.oracle]
      place: crates/rastro-cli/tests/
      timeout: 2400
  - id: S10
    when: the CLI prints about or why without --json, or with --json
    then: each labelled entity shows its label after its id with control chars escaped; with --json the envelope equals the MCP result
    evidence:
      check: CARGO_TARGET_DIR="$XDG_CACHE_HOME/rastro-eec-target" cargo test -p rastro-cli --test labels_oracle S10_
      baseline: fail
      oracle: [labels_oracle.rs.oracle]
      place: crates/rastro-cli/tests/
      timeout: 2400
  - id: S11
    when: an MCP client lists tools
    then: the about and why descriptions say label text is untrusted data
    evidence:
      check: CARGO_TARGET_DIR="$XDG_CACHE_HOME/rastro-eec-target" cargo test -p rastro-cli --test labels_oracle S11_
      baseline: fail
      oracle: [labels_oracle.rs.oracle]
      place: crates/rastro-cli/tests/
      timeout: 2400

  # Linear state
  - id: S12
    when: a Linear issue's `/state/name` evidence is extracted, and the name later changes
    then: an observed `tracker:state` claim holds that name; after the change the old claim is superseded and the new one is current

  # Sync progress
  - id: S13
    when: a source syncs
    then: before the read stderr names the source and its reason, `first read from <window_start>` with no complete check, `incremental since <window_end>` otherwise, `re-read from <window_start>` with --reread
    evidence:
      check: CARGO_TARGET_DIR="$XDG_CACHE_HOME/rastro-eec-target" cargo test -p rastro-cli --test sync_progress_oracle S13_
      baseline: fail
      oracle: [sync_progress_oracle.rs.oracle]
      place: crates/rastro-cli/tests/
      timeout: 2400
  - id: S14
    when: a source syncs, and extract replays stored evidence because the extractor version changed
    then: stderr shows the read, extract and project stages in order; on a replay the extract line says so
  - id: S15
    when: a read lasts longer than 2 s
    then: stderr shows at least one running item count, and never more than one count line per 2 s
  - id: S16
    when: a source finishes, or ends rate_limited
    then: stderr shows its result line with submitted, accepted and unchanged counts; when rate_limited the line gives the retry time
    evidence:
      check: CARGO_TARGET_DIR="$XDG_CACHE_HOME/rastro-eec-target" cargo test -p rastro-cli --test sync_progress_oracle S16_
      baseline: fail
      oracle: [sync_progress_oracle.rs.oracle]
      place: crates/rastro-cli/tests/
      timeout: 2400
  - id: S17
    when: sync --json runs, or stderr is closed or broken
    then: stdout holds only the one result envelope; with stderr closed or broken, sync completes with the same result and exit code

  # Rename warning
  - id: S18
    when: a configured source has no complete check and a stored source no longer in config has the same connector and selector, in any scope
    then: before the read stderr warns, naming both sources, and the sync result's `warnings` lists it; the read still runs from window_start
    evidence:
      check: CARGO_TARGET_DIR="$XDG_CACHE_HOME/rastro-eec-target" cargo test -p rastro-cli --test sync_progress_oracle S18_
      baseline: fail
      oracle: [sync_progress_oracle.rs.oracle]
      place: crates/rastro-cli/tests/
      timeout: 2400
  - id: S19
    when: the configured source already has a complete check, or no stored-only source shares its connector and selector
    then: no warning is given and `warnings` is empty

  # Switch day
  - id: S20
    when: the slice has landed
    then: the owner preps one morning's standup with `about me` over MCP without opening Linear or GitHub
    evidence:
      human: The owner prepped one morning's standup from `about me` over MCP, without opening Linear or GitHub

