schema: plan/2
slug: native-slack
goal: >-
  An owner registers an approved Slack channel with a read-only token from their own Slack app and syncs its
  messages and thread replies as cited evidence with honest coverage, while shared, direct and hidden
  conversations are never read and the token is never stored.
spec: docs/specs/evidence.md
archive: promote

requirements:
  added:
    - title: The Slack check accepts only the read scopes
      shall: >-
        The Slack connector's check SHALL answer authenticated only for a token that holds every required read
        scope (`channels:read`, `channels:history`, `groups:read`, `groups:history`, `users:read`) and no
        other scope, and SHALL answer rejected naming the extra or missing scopes otherwise.
      scenarios:
        - id: S1
          name: a token with exactly the read scopes
          when: "`rastro check` runs a Slack source whose token the scripted API reports with exactly the five read scopes"
          then: the check reports authenticated and names the credential source
        - id: S2
          name: a token with a write scope
          when: the scripted API reports the token's scopes as the five read scopes plus `chat:write`
          then: the check reports rejected naming `chat:write` and exits unsuccessfully
        - id: S3
          name: a token missing a read scope
          when: the scripted API reports the token's scopes without `groups:history`
          then: the check reports rejected naming `groups:history` and exits unsuccessfully

    - title: A Slack token comes from the environment or the keychain and is never stored
      shall: >-
        The Slack connector SHALL take its token from `SLACK_USER_TOKEN`, else from the keychain item
        `rastro-slack`, and the token SHALL never appear in the database, the config or any output.
      scenarios:
        - id: S4
          name: the keychain item is used when the variable is unset
          when: "`SLACK_USER_TOKEN` is unset and the keychain item `rastro-slack` holds a valid token"
          then: the check reports authenticated naming the keychain item `rastro-slack`
        - id: S5
          name: no token anywhere
          when: a Slack source syncs with no `SLACK_USER_TOKEN` and no keychain item
          then: >-
            coverage records "couldn't look: auth"
        - id: S6
          name: the token leaves no trace
          when: a check and a sync have run with a token
          then: the token's bytes appear in none of the database file, the config, stdout or stderr

    - title: A Slack source names one channel by its id
      shall: >-
        `rastro source add --connector slack` SHALL require a `channel` option holding a Slack channel id, and
        SHALL refuse a channel name with an error naming the declared option, saving nothing.
      scenarios:
        - id: S7
          name: a channel id is saved
          when: "`rastro source add --connector slack --option channel=C0123ABCDE` runs"
          then: the source is saved with that channel
        - id: S8
          name: a channel name is refused
          when: "`rastro source add --connector slack --option channel=general` runs"
          then: it is refused with an error naming the declared `channel` option, and nothing is saved

    - title: A shared, direct or hidden Slack conversation is never read
      shall: >-
        Before reading any history, the Slack connector SHALL look up the channel, and SHALL record "couldn't
        look" without a history call when the channel is shared outside the workspace, is a direct or group
        message, or is not visible to the token owner.
      scenarios:
        - id: S9
          name: a Slack Connect channel
          when: the scripted channel lookup reports the channel as externally shared
          then: >-
            coverage records "couldn't look: forbidden" and the scripted API received no history call
        - id: S10
          name: a direct message
          when: the scripted channel lookup reports the conversation as a direct message
          then: >-
            coverage records "couldn't look: forbidden" and the scripted API received no history call
        - id: S11
          name: a channel the owner can't see
          when: the scripted channel lookup answers `channel_not_found`
          then: >-
            coverage records "couldn't look: not_found_or_hidden" and the scripted API received no history call

    - title: A Slack sync stores each message's fields as evidence
      shall: >-
        A Slack sync SHALL store each in-window message as observations at `slack:message/<channel>/<ts>`, with
        the raw `/text` as untrusted content and `/user`, `/thread_ts`, `/subtype` and `/edited/ts` as
        structured, using the edit time, else the post time, as its update time, and SHALL skip system messages.
      scenarios:
        - id: S12
          name: messages are stored raw
          when: a channel whose in-window message text holds a `<@U0OWNER>` mention syncs
          then: the stored `/text` quote equals the raw message text, mention included, as untrusted content, and coverage reads found
        - id: S13
          name: an edited message carries its edit time
          when: an in-window message carries an edit time
          then: its observations' update time is the edit time
        - id: S14
          name: system messages are skipped and bot messages kept
          when: the channel holds a `channel_join` message and a bot message in the window
          then: the bot message is stored and the `channel_join` message is not

    - title: A Slack sync records the token owner and each author
      shall: >-
        A Slack sync SHALL record the token owner at `slack:viewer` and each message author at
        `slack:user/<id>` as structured observations, and an author profile it cannot read SHALL be a coverage
        gap that keeps the messages.
      scenarios:
        - id: S15
          name: viewer and authors are recorded
          when: a channel with messages from two authors syncs
          then: "`slack:viewer` holds the token owner's id and each author has observations at `slack:user/<id>`, including whether it is a bot"
        - id: S16
          name: an unreadable author profile
          when: the scripted user lookup fails for one author
          then: that author's messages are stored and coverage carries a gap naming user profiles

    - title: Thread replies are read through a 30-day lookback
      shall: >-
        A Slack sync SHALL read the replies posted inside its window to threads started up to 30 days before
        the window, and SHALL store each message posted at the window's start exactly once across consecutive
        syncs.
      scenarios:
        - id: S17
          name: a reply to an older thread
          when: a reply posted inside the window belongs to a thread started three days before the window
          then: the reply is stored at its location with `/thread_ts` naming the thread's start
        - id: S18
          name: a lookback thread with no new replies
          when: a thread started inside the lookback has no reply posted inside the window
          then: the scripted API received no replies call for that thread
        - id: S19
          name: a message at the window's start
          when: two consecutive syncs run and a message's post time equals the second window's start
          then: the message's text is stored exactly once

    - title: A Slack failure stops the run with a typed reason
      shall: >-
        The Slack connector SHALL keep the evidence of finished pages and record "couldn't look" with a typed
        reason when Slack answers a rate limit, a rejected token or a missing scope, reporting a rate limit's
        retry time without waiting.
      scenarios:
        - id: S20
          name: a rate limit mid-run
          when: the second history page answers HTTP 429 with `Retry-After` 30
          then: >-
            the first page's evidence is kept and coverage records "couldn't look: rate_limited" with a retry time 30 seconds after the response
        - id: S21
          name: a revoked token
          when: the history call answers `token_revoked`
          then: >-
            coverage records "couldn't look: auth"
        - id: S22
          name: a missing scope
          when: the history call answers `missing_scope`
          then: >-
            coverage records "couldn't look: forbidden"

    - title: The Slack app template asks only for the read scopes
      shall: >-
        The Slack connector SHALL ship a Slack app manifest template whose user scopes are exactly the five read
        scopes, with no bot scopes, token rotation off and a display name the owner chooses.
      scenarios:
        - id: S23
          name: the template's scopes
          when: the shipped template is parsed
          then: its user scopes equal the five read scopes, it declares no bot scopes, and token rotation is off

tickets:
  - id: T1
    delivers: >-
      A new Slack connector crate installed like Linear's: manifest with the `channel` option and declared
      environment, the app manifest template, the token from the environment or keychain, and the `--check`
      probe that enforces the scope set, all driven against a scripted Slack API on loopback.
    satisfies: [S1, S2, S3, S4, S7, S8, S23]
    paths:
      - crates/rastro-connector-slack/
      - crates/rastro-connector-slack/tests/
      - Cargo.toml
      - scripts/affected-tests.test.sh
      - crates/rastro-cli/tests/source_check.rs
    size: regular
    difficulty: complex
    risk: [security, external]
  - id: T2
    delivers: >-
      Channel sync: the conversation guard before any history read, in-window messages, viewer and author
      records as evidence, system messages skipped, typed failures and rate limits with retry times, and no
      token anywhere it could leak.
    satisfies: [S5, S6, S9, S10, S11, S12, S13, S14, S15, S16, S20, S21, S22]
    paths:
      - crates/rastro-connector-slack/
      - crates/rastro-connector-slack/tests/
    size: regular
    difficulty: complex
    risk: [security, external]
    blocked_by: [T1]
  - id: T3
    delivers: >-
      Thread replies through the 30-day lookback, half-open window boundaries across consecutive syncs, and the
      lookback recorded in `docs/decisions/plugins.md` §50.
    satisfies: [S17, S18, S19]
    paths:
      - crates/rastro-connector-slack/
      - crates/rastro-connector-slack/tests/
      - docs/decisions/plugins.md
    size: regular
    difficulty: complex
    risk: [external, state]
    blocked_by: [T2]
