schema: plan/2
slug: g7-adversarial-fixtures
goal: Prove the Act pipeline contains attacker-written Linear content at P0 - reach, gates and payload hold under hostile fixtures and one live run.
spec: docs/specs/actions.md
archive: promote
requirements:
  added:
    - title: Hostile proposal content does not widen Act reach
      shall: Rule matching SHALL act only on action, team and assignee, and instruction-like proposal content SHALL NOT create an Act outside the matching rule's terms.
      scenarios:
        - id: S1
          name: injection content creates no extra Act
          when: a proposal whose title and description embed instructions to create issues for another team or another action is proposed under a rule on team H
          then: the only Act recorded is the rule's own (linear.create_issue, team H, assignee me), and no run exists for any other team or action
    - title: Hostile content does not bypass the Act safety gates
      shall: An Act whose proposal content is hostile SHALL remain subject to grace, stop and recheck exactly as a benign Act is.
      scenarios:
        - id: S2
          name: grace holds under hostile content
          when: an Act with injection-laden title and description is pending within its grace window and tick runs
          then: the fake Linear server receives no request before grace ends
        - id: S3
          name: stop holds under hostile content
          when: a pending hostile-content Act is stopped and later ticks run
          then: no issue create is sent for it, ever
        - id: S4
          name: recheck holds under hostile content
          when: a hostile-content Act's recheck finds an open issue with the same title during grace
          then: the Act returns and no issue create is sent
    - title: The outbound payload stays exact under hostile content
      shall: The issue create for a hostile-content Act SHALL carry exactly the five input fields with the content as authored, and SHALL add no Rastro id, link, why, citation, footer, label or marker even when the content itself embeds Rastro-looking ids.
      scenarios:
        - id: S5
          name: the payload is exact under hostile content
          when: a hostile-content Act executes whose description embeds injection text, markdown and Rastro-looking ids and links
          then: the fake Linear server receives exactly one IssueCreate whose input keys are exactly assigneeId, description, id, teamId, title, with title and description unchanged as authored and no added Rastro field
        - id: S6
          name: hostile content drives no extra request
          when: the same hostile-content Act executes
          then: the recorded operation sequence is exactly IssueLookup, Teams, Viewer, IssueCreate
        - id: S7
          name: live proof on real Linear
          when: the owner runs the adversarial scenario against real Linear on a disposable issue at the release commit
          then: the recorded run shows the exact payload and containment with no escape, and the result is recorded for the G7 gate
tickets:
  - id: T1
    delivers: Adversarial fixtures pinning Act reach, gates and payload under hostile content.
    satisfies: [S1, S2, S3, S4, S5, S6]
    paths: [crates/rastro-cli/tests/]
    size: regular
    difficulty: complex
    risk: [security]
  - id: T2
    delivers: Live adversarial proof against real Linear, recorded for the G7 P0 exit gate.
    satisfies: [S7]
    paths: [docs/pm/gtm-plan.md]
    owner: fbisca
    blocked_by: [T1]
