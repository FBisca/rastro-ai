schema: plan/1
slug: commitments
goal: The owner reads the commitments their conversations proposed, as cited hypotheses with their quotes and kinds, from one `commitments` list on CLI and MCP.
spec: docs/specs/commitments.md
outcome: [S1, S2, S5, S8, S10]

scenarios:
  # The list
  - id: S1
    when: The owner asks for commitments and a source has hypotheses.
    then: The list shows every hypothesis with its source (kind, name, scope), its kind (`ask`, `promise` or `waiting_on`), the promise text, the stated date or null, the responsible and the recipient (label, and the entity only when the owner mapped it explicitly, else null), the exact quote with its turn, speaker and byte range, the status `hypothesis`, and the standard vocabulary terms it expresses; and for each source its extraction state, its coverage state and whether its results are stale.
    evidence:
      check: CARGO_TARGET_DIR="$XDG_CACHE_HOME/rastro-eec-target" cargo test -p rastro-cli --test commitments_oracle S1_
      baseline: fail
      oracle: [commitments_oracle.rs.oracle]
      place: crates/rastro-cli/tests/
      timeout: 2400
  - id: S2
    when: Two sources have hypotheses, or the caller filters by source or by vocabulary term.
    then: One list holds both sources' hypotheses, each naming its source; a source filter narrows the list to that source and drops the other sources' entries; a term filter narrows the hypotheses to those expressing that term; a filter that matches nothing returns an empty list, not an error.
    evidence:
      check: CARGO_TARGET_DIR="$XDG_CACHE_HOME/rastro-eec-target" cargo test -p rastro-cli --test commitments_oracle S2_
      baseline: fail
      oracle: [commitments_oracle.rs.oracle]
      place: crates/rastro-cli/tests/
      timeout: 2400
  - id: S3
    when: A source has no hypotheses, or its last run failed, or its coverage couldn't look.
    then: "The list names that source: `found nothing` when it has none, the failed run with its cause, or `couldn't look` with its reason; a source is never left out silently."
    evidence:
      check: CARGO_TARGET_DIR="$XDG_CACHE_HOME/rastro-eec-target" cargo test -p rastro-cli --test commitments_oracle S3_
      baseline: fail
      oracle: [commitments_oracle.rs.oracle]
      place: crates/rastro-cli/tests/
      timeout: 2400
  - id: S4
    when: The launch scope hides a source.
    then: Its hypotheses are absent from the list, and the list still succeeds.
    evidence:
      check: CARGO_TARGET_DIR="$XDG_CACHE_HOME/rastro-eec-target" cargo test -p rastro-cli --test commitments_oracle S4_
      baseline: fail
      oracle: [commitments_oracle.rs.oracle]
      place: crates/rastro-cli/tests/
      timeout: 2400

  # The standard vocabulary
  - id: S5
    when: The standard vocabulary is loaded.
    then: "It defines `std:Commitment` and the predicates `std:owes`, `std:owed_to`, `std:due` and `std:waiting_on`, each with a definition, what it is not, examples and the evidence it needs; and every hypothesis carries the terms it expresses: `std:owes` when it has a responsible party, `std:owed_to` when it has a recipient, `std:due` when it states a date, and `std:waiting_on` when it is a waiting-on."
    evidence:
      check: CARGO_TARGET_DIR="$XDG_CACHE_HOME/rastro-eec-target" cargo test -p rastro-cli --test commitments_oracle S5_
      baseline: fail
      oracle: [commitments_oracle.rs.oracle]
      place: crates/rastro-cli/tests/
      timeout: 2400

  # The agent tool adapter
  - id: S6
    when: The owner imports a conversation with a configured agent tool adapter.
    then: The core calls the adapter over the plugin protocol with the content, its own instructions and the fields it expects, and keeps only the candidates that pass the core's own checks (an exact contiguous quote, the owner's involvement, a stated date the quote states); an adapter whose response breaks the expected shape fails the run and keeps the last good results.
    evidence:
      check: CARGO_TARGET_DIR="$XDG_CACHE_HOME/rastro-eec-target" cargo test -p rastro-cli --test adapter S6_
      baseline: fail
      timeout: 2400
  - id: S7
    when: An adapter's manifest is checked.
    then: It declares the kind `agent-tool-adapter` and the agent-tool capabilities it needs, never a named tool; a manifest that names a tool, or that doesn't declare the kind, is refused before anything runs.
    evidence:
      check: CARGO_TARGET_DIR="$XDG_CACHE_HOME/rastro-eec-target" cargo test -p rastro-cli --test adapter S7_
      baseline: fail
      timeout: 2400

  # Recorded, replayed, never re-called
  - id: S8
    when: A run succeeds, is replayed, or the projection is rebuilt.
    then: The interpretation is recorded with the spans it cites; a replay checks it again with no model call, and a replay of a record that no longer validates fails and marks the results stale; a rebuild never calls a model; an export leaves the recorded output and the spans out.
    evidence:
      check: CARGO_TARGET_DIR="$XDG_CACHE_HOME/rastro-eec-target" cargo test -p rastro-cli --test commitments_oracle S8_
      baseline: fail
      oracle: [commitments_oracle.rs.oracle]
      place: crates/rastro-cli/tests/
      timeout: 2400

  # Bots
  - id: S9
    when: A candidate's party is explicitly mapped to an account the evidence says is a bot.
    then: The candidate is excluded and counted; a party that is only named is not excluded.
    evidence:
      check: CARGO_TARGET_DIR="$XDG_CACHE_HOME/rastro-eec-target" cargo test -p rastro-cli --test commitments S9_
      baseline: fail
      timeout: 2400

  # Switch day
  - id: S10
    when: The slice has landed.
    then: The owner reads the commitments of a real conversation from the `commitments` list over MCP, without opening the transcript by hand.
    evidence:
      human: The owner read one real conversation's commitments over MCP, from the `commitments` list, without opening the transcript by hand.

