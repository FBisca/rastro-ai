schema: plan/2
slug: judgment-adapters
goal: The owner can bind codex, pi and decision adapters beside the claude one, and judgment runs as capped multi-turn sessions with every turn recorded and the trust boundary matched before a run.
spec: docs/specs/commitments.md
archive: promote
requirements:
  modified:
    - title: The core calls the adapter and keeps only the candidates that pass its checks
      shall: The core SHALL call the owner's configured agent tool adapter over the plugin protocol with the content, its own instructions and the fields it expects, SHALL execute its own gates on every answer and send a gate failure back as the next turn of the same session with core-authored feedback while turns remain under the cap (default 3 turns, per-turn timeout 600s), and SHALL keep only the candidates that pass the core's own checks, an exact contiguous quote, the owner's involvement and a stated date the quote states.
      scenarios:
        - id: S1
          name: only the candidates the core's checks pass are kept
          when: the owner imports a conversation with a configured agent tool adapter and an answer passes the core's gates
          then: only the candidates that pass the core's own checks are kept, an exact contiguous quote, the owner's involvement and a stated date the quote states
        - id: S2
          name: a gate failure earns a retry turn in the same session
          when: an answer fails a shape or quote gate and turns remain under the cap
          then: the core sends the failure reason (gate, field, expected, actual) as the next turn of the same session, and no new session is opened
        - id: S3
          name: exhausted caps or a fatal answer fails the run stale
          when: gate failures exhaust the turn cap, or the adapter never answers or answers with an error
          then: the run fails and the last good results stay marked stale
  added:
    - title: Every turn of a judgment session is recorded
      shall: The core SHALL record the request, answer and gate verdict of every turn of a judgment session including failed turns, SHALL make only the final validated output evidence, and SHALL leave turn history out of an export.
      scenarios:
        - id: S4
          name: failed turns are recorded
          when: a run includes failed turns
          then: the run's history holds each turn's request, answer and gate verdict
        - id: S5
          name: only the final validated output becomes evidence
          when: a run succeeds after retry turns
          then: only the final validated output becomes evidence
        - id: S6
          name: an export leaves turn history out
          when: a database is exported
          then: turn history stays out
    - title: The core matches the adapter's declared boundary enforcement before a run
      shall: An adapter's manifest SHALL declare the boundary controls it can enforce, and the core SHALL match them against the judgment floor (tools off, no MCP servers, no setting sources) before a run and refuse the run naming any unenforceable control, never starting the adapter in a degraded-security mode.
      scenarios:
        - id: S7
          name: a mismatch refuses the run naming the control
          when: a bound adapter's manifest lacks a control the judgment floor requires
          then: the run is refused naming the unenforceable control and the adapter is never started
        - id: S8
          name: a full declaration lets the run proceed
          when: a bound adapter declares every control the judgment floor requires
          then: the run proceeds
    - title: A harness adapter is a thin CLI driver bindable for one-shot judgment
      shall: A codex, pi or claude adapter SHALL drive its harness CLI over the shared SDK as a plugin of kind agent-tool-adapter with capability judge_text and no action permission, bindable through [commitment_adapter], and SHALL answer a one-shot judgment.request by driving its harness with the lockdown kit and relaying the structured answer.
      scenarios:
        - id: S9
          name: a new adapter's manifest passes the check
          when: a codex, pi or decision adapter's manifest is checked
          then: it passes as kind agent-tool-adapter with its declared capability and no named tool
        - id: S10
          name: a one-shot request drives the harness under lockdown
          when: a one-shot judgment.request reaches a harness adapter
          then: the adapter drives its harness with tools off, no MCP servers and no setting sources, and relays the structured answer
    - title: A session turn resumes the harness or degrades recorded
      shall: A session-capable adapter SHALL continue a session by resuming the harness session whose id the first turn produced, in a fresh process with the lockdown flags re-applied, and SHALL degrade to a fresh turn carrying the prior answer and the failure reason when resume is unavailable, recording the degradation.
      scenarios:
        - id: S11
          name: a retry turn resumes the harness session
          when: a retry turn runs on a harness with usable resume
          then: the adapter resumes the persisted harness session id in a fresh process with the lockdown flags re-applied
        - id: S12
          name: an unavailable resume degrades recorded
          when: the harness has no usable resume
          then: the adapter runs a fresh turn carrying the prior answer and the failure reason, and records the degradation
    - title: A decision adapter scores text through the same session protocol
      shall: A decision adapter SHALL be a plugin of kind agent-tool-adapter with capability score_text and no action permission, answering decision.request with caller-defined structured output that the core validates against the caller's schema, speaking the same capped session protocol as an agent adapter.
      scenarios:
        - id: S13
          name: schema-valid decision output is kept
          when: a decision.request reaches a decision adapter
          then: it answers with structured output and only output that passes the caller's schema is kept
        - id: S14
          name: a broken decision shape fails the run stale
          when: a decision adapter's output breaks the caller's schema
          then: the run fails and the last good results stay
