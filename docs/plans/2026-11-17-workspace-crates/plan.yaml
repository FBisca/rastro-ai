schema: plan/2
slug: workspace-crates
goal: >-
  Each rastro crate declares its role and depends only on the roles that role allows, and every crate
  inherits the workspace's size and complexity lints, so a boundary breach or an oversized function fails CI.
spec: docs/specs/workspace/crates.md
archive: promote

requirements:
  added:
    - title: Crates depend by role
      shall: >-
        Every workspace member SHALL declare a role in `[package.metadata.rastro]`, and the crate gate SHALL
        fail on a member dependency, normal, dev or build, that the role table does not allow.
      scenarios:
        - id: S1
          name: a forbidden edge fails
          when: a member depends on a member its role does not allow, as the plugin SDK on core
          then: the crate gate exits non-zero naming both crates and their roles
        - id: S2
          name: a missing role fails
          when: a member declares no role, or a role outside the table
          then: the crate gate exits non-zero naming the crate
        - id: S3
          name: today's workspace passes
          when: the crate gate runs on the repository
          then: it passes, every member carrying its role

    - title: Every crate inherits the workspace lints
      shall: >-
        Every workspace member SHALL inherit the workspace clippy lints `too_many_lines`,
        `cognitive_complexity`, `too_many_arguments`, `fn_params_excessive_bools` and
        `struct_excessive_bools`, and a function over a limit SHALL carry its own `#[expect]` with a reason.
      scenarios:
        - id: S4
          name: a crate outside the lints fails
          when: a member's manifest lacks `[lints] workspace = true`
          then: the crate gate exits non-zero naming the crate
        - id: S5
          name: the workspace is clean under the lints
          when: CI runs clippy on every target with `-D warnings`
          then: >-
            it passes, each existing offender carrying `#[expect(clippy::<lint>, reason = "…")]` at its
            function

tickets:
  - id: T1
    delivers: >-
      Every crate declares its role, and a CI crate gate refuses a member dependency the role table does
      not allow or a crate with no known role
    satisfies: [S1, S2, S3]
    paths:
      - crates/rastro-plugin-sdk/Cargo.toml
      - crates/rastro-test-connector/Cargo.toml
      - crates/rastro-test-extractor/Cargo.toml
      - crates/rastro-extractor-github/Cargo.toml
      - crates/rastro-core/Cargo.toml
      - crates/rastro-storage-sqlite/Cargo.toml
      - crates/rastro-cli/Cargo.toml
      - crates/rastro-connector-github/Cargo.toml
      - crates/rastro-operations/Cargo.toml
      - crates/rastro-connector-linear/Cargo.toml
      - crates/rastro-extractor-linear/Cargo.toml
      - crates/rastro-adapter-claude-code/Cargo.toml
      - scripts/crate-gate.sh
      - scripts/crate-gate.test.sh
      - scripts/fixtures/crate-gate/
      - .github/workflows/ci.yml
      - docs/development.md
    size: regular
    difficulty: simple

  - id: T2
    delivers: >-
      The workspace declares the five clippy lints, and the crates with no offender (plugin SDK, Claude
      Code adapter, test connector) inherit them
    satisfies: [S5]
    paths:
      - Cargo.toml
      - crates/rastro-plugin-sdk/
      - crates/rastro-adapter-claude-code/
      - crates/rastro-test-connector/
    size: small
    difficulty: simple
    blocked_by: [T1]

  - id: T3
    delivers: rastro-storage-sqlite inherits the lints, each offender marked with its own `#[expect]`
    satisfies: [S5]
    paths: [crates/rastro-storage-sqlite/]
    size: regular
    difficulty: simple
    blocked_by: [T2]

  - id: T4
    delivers: rastro-cli inherits the lints, each offender marked with its own `#[expect]`
    satisfies: [S5]
    paths: [crates/rastro-cli/]
    size: regular
    difficulty: simple
    blocked_by: [T2]

  - id: T5
    delivers: rastro-core and rastro-operations inherit the lints, each offender marked with its own `#[expect]`
    satisfies: [S5]
    paths: [crates/rastro-core/, crates/rastro-operations/]
    size: regular
    difficulty: simple
    blocked_by: [T2]

  - id: T6
    delivers: >-
      The GitHub and Linear connectors and extractors and the test extractor inherit the lints, each
      offender marked with its own `#[expect]`
    satisfies: [S5]
    paths:
      - crates/rastro-connector-github/
      - crates/rastro-connector-linear/
      - crates/rastro-extractor-github/
      - crates/rastro-extractor-linear/
      - crates/rastro-test-extractor/
    size: regular
    difficulty: simple
    blocked_by: [T2]

  - id: T7
    delivers: The crate gate refuses a member whose manifest does not inherit the workspace lints
    satisfies: [S4]
    paths: [scripts/crate-gate.sh, scripts/crate-gate.test.sh, scripts/fixtures/crate-gate/]
    size: small
    difficulty: simple
    blocked_by: [T3, T4, T5, T6]
