schema: plan/2
slug: workspace-tests
goal: >-
  Anyone working in rastro runs the tests under cargo-nextest: a fast unit suite by default, live tests
  only on request, a hung test killed, and the last run's failures readable and rerunnable without running
  the suite again.
spec: docs/specs/workspace/tests.md
archive: promote

requirements:
  added:
    - title: Tests run under nextest
      shall: >-
        CI, the orchestrate check tiers and the affected selector SHALL run the workspace's tests with
        cargo-nextest, each test in its own process.
      scenarios:
        - id: S1
          name: the whole suite passes process-per-test
          when: CI or the full check tier runs the workspace's tests
          then: >-
            it runs `cargo nextest run --workspace`, and every test that passes under `cargo test --workspace`
            passes there
        - id: S2
          name: the affected selector runs nextest
          when: scripts/affected-tests.sh runs for paths that select crates
          then: >-
            it invokes `cargo nextest run` with one `-p` per selected crate, or `--workspace` for a global path,
            and its `--dry-run` selection is unchanged

    - title: A test runs its own binary snapshot
      shall: >-
        A test that runs a workspace binary SHALL run a private snapshot that no other test process removes
        or replaces while it runs.
      scenarios:
        - id: S3
          when: many test processes snapshot and sweep the same binaries at once, as nextest runs them
          then: >-
            every test runs its own snapshot to completion, and none panics on a missing snapshot or binary

    - title: A test's location is its level
      shall: >-
        A test in a `src/` `#[cfg(test)]` module SHALL be a unit test that starts no process and touches no
        filesystem or socket, a test under `tests/` SHALL be an integration test, and an ignored test SHALL be
        a live or bench test by its reason.
      scenarios:
        - id: S4
          name: the fast suite is the unit tests
          when: "`cargo nextest run --profile fast` runs"
          then: every `src/` unit test runs, and no test from a `tests/` binary runs
        - id: S5
          name: an ignored test says why
          when: an `#[ignore]` carries no reason, or a reason that does not start with `live:` or `bench:`
          then: the ignore check exits non-zero naming the file and line
        - id: S6
          name: live tests only on request
          when: the default profile runs, and when the `live` profile runs
          then: the default run skips every ignored test, and the `live` run runs the ignored ones alone

    - title: A hung test fails
      shall: >-
        The default profile SHALL report a test running past 20 seconds as SLOW and SHALL kill and fail a
        test running past 60 seconds.
      scenarios:
        - id: S7
          when: a test runs past 60 seconds under the repository's nextest config
          then: nextest terminates it, names it as timed out, and the run exits non-zero

    - title: The last run's failures are kept
      shall: >-
        Every nextest run SHALL leave a JUnit report holding each failing test with its output, and a
        recording from which only the failures rerun.
      scenarios:
        - id: S8
          when: a run has a failing test
          then: "`target/nextest/<profile>/junit.xml` names that test and holds its captured output"
        - id: S9
          when: "`cargo nextest run --rerun latest` follows a run with failures"
          then: only the tests that failed or did not complete run again

tickets:
  - id: T1
    delivers: >-
      The binary-snapshot helper keeps each test's snapshot alive while it runs under process-per-test,
      so the 10 tests that fail under nextest pass
    satisfies: [S3]
    paths: [crates/rastro-cli/tests/support/binaries.rs, crates/rastro-cli/tests/snapshots.rs]
    size: small
    difficulty: complex
    risk: [concurrency]

  - id: T2
    delivers: >-
      cargo-nextest runs the tests in CI, the check tiers and the affected selector, with the 20s/60s
      timeout, JUnit failure output and recorded runs; ADR-0013 records the choice
    satisfies: [S1, S2, S7, S8, S9]
    paths:
      - .config/nextest.toml
      - .github/workflows/ci.yml
      - .orchestrate/config.yaml
      - scripts/affected-tests.sh
      - scripts/affected-tests.test.sh
      - scripts/nextest-config.test.sh
      - scripts/fixtures/nextest/
      - docs/development.md
      - AGENTS.md
      - docs/adr/0013-cargo-nextest-runs-the-tests.md
    size: regular
    difficulty: simple
    blocked_by: [T1]

  - id: T3
    delivers: >-
      Every ignored test says `live:` or `bench:` and the env vars it reads, a check refuses any other
      ignore, and a `live` profile runs the ignored tests alone
    satisfies: [S5, S6]
    paths:
      - .config/nextest.toml
      - crates/rastro-cli/tests/live.rs
      - crates/rastro-cli/tests/claims.rs
      - crates/rastro-cli/tests/mcp.rs
      - crates/rastro-storage-sqlite/tests/scoped_benchmark.rs
      - scripts/ignored-tests.sh
      - scripts/ignored-tests.test.sh
      - .github/workflows/ci.yml
      - docs/development.md
    size: regular
    difficulty: simple
    blocked_by: [T2]

  - id: T4
    delivers: >-
      The `src/` tests that touch the filesystem or a process move under `tests/`, and a `fast` profile,
      the fast check tier, runs the unit tests alone
    satisfies: [S4]
    paths:
      - .config/nextest.toml
      - .orchestrate/config.yaml
      - crates/rastro-core/src/host/mod.rs
      - crates/rastro-core/tests/
      - crates/rastro-operations/src/catalog.rs
      - crates/rastro-operations/tests/
      - crates/rastro-storage-sqlite/src/lib.rs
      - crates/rastro-storage-sqlite/tests/
      - scripts/fast-suite.test.sh
      - docs/development.md
    size: regular
    difficulty: simple
    blocked_by: [T3]
