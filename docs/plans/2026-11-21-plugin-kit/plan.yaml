schema: plan/2
slug: plugin-kit
goal: >-
  A plugin author outside the repository, in any language, builds a connector against a published JSON Schema
  of the protocol and checks it with one command that names every protocol violation and stores nothing.
spec: docs/specs/surfaces.md
archive: promote

requirements:
  added:
    - title: The generated plugin protocol schema equals the committed file
      shall: >-
        The schema generator SHALL produce `schema/plugin-protocol-v1.schema.json` from the connector role's
        messages and the plugin manifest, and any difference between the generated and the committed schema
        SHALL fail the test.
      scenarios:
        - id: S1
          name: the generator's output is the committed file
          when: the plugin protocol schema generator runs
          then: its output equals the committed `schema/plugin-protocol-v1.schema.json`, and any difference fails the test
        - id: S2
          name: a real session validates
          when: the messages the scripted test connector exchanges with the host in a sync are validated against the committed schema
          then: every message validates

    - title: Plugin check runs one synthetic connector run and stores nothing
      shall: >-
        `rastro plugin check <id>` SHALL run one synthetic run of the installed connector with its declared
        environment and the given options, apply the validation a sync applies, store nothing, and exit zero
        with the accepted counts when nothing is violated.
      scenarios:
        - id: S3
          name: a conforming connector
          when: "`rastro plugin check` runs a scripted test connector that submits valid evidence, a coverage report and a finish"
          then: it exits zero and prints the accepted counts
        - id: S4
          name: nothing is stored
          when: "`rastro plugin check` has run against a fresh home"
          then: no evidence, coverage or run is stored

    - title: Plugin check names each protocol violation
      shall: >-
        `rastro plugin check <id>` SHALL print each protocol violation with its reason and exit unsuccessfully
        when any occurred.
      scenarios:
        - id: S5
          name: a log line on stdout
          when: the checked connector writes a plain log line to stdout
          then: the check names an invalid protocol line and exits unsuccessfully
        - id: S6
          name: evidence outside the grant
          when: the checked connector submits evidence of a kind its manifest does not permit
          then: the check names that kind and exits unsuccessfully
        - id: S7
          name: no finish
          when: the checked connector exits without a finish
          then: the check names the run as interrupted and exits unsuccessfully

    - title: Plugin check warns on an unknown manifest kind
      shall: >-
        `rastro plugin check <id>` SHALL warn about each manifest kind the core does not know, without failing a
        run that has no violation.
      scenarios:
        - id: S8
          name: an unknown kind
          when: the checked connector's manifest also declares a kind the core does not know and its run has no violation
          then: the check warns naming that kind and exits zero

    - title: Plugin check stays on the CLI
      shall: The plugin check SHALL be a CLI command and SHALL NOT be exposed as an MCP tool.
      scenarios:
        - id: S9
          name: the MCP tool list
          when: an agent lists MCP tools
          then: no plugin check tool is listed

tickets:
  - id: T1
    delivers: >-
      Schema derives on the connector messages and the manifest in the plugin SDK, a generator writing
      `schema/plugin-protocol-v1.schema.json`, the equality test, and a test validating a recorded scripted
      session against it.
    satisfies: [S1, S2]
    paths:
      - crates/rastro-plugin-sdk/
      - schema/plugin-protocol-v1.schema.json
      - crates/rastro-cli/tests/plugin_schema.rs
    size: regular
    difficulty: complex
  - id: T2
    delivers: >-
      `rastro plugin check <id>`: one synthetic connector run through the host's validation with nothing
      stored, violations and unknown-kind warnings printed, CLI only; the authoring guide
      `docs/plugins/authoring.md` with the TypeScript traps; and `docs/decisions/plugins.md` §51.
    satisfies: [S3, S4, S5, S6, S7, S8, S9]
    paths:
      - crates/rastro-core/src/host/
      - crates/rastro-cli/src/main.rs
      - crates/rastro-cli/tests/plugin_check.rs
      - crates/rastro-test-connector/
      - docs/plugins/authoring.md
      - docs/decisions/plugins.md
    size: regular
    difficulty: complex
    risk: [security]
