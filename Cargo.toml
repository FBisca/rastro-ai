[workspace]
members = ["crates/rastro-plugin-sdk", "crates/rastro-test-connector", "crates/rastro-test-extractor", "crates/rastro-extractor-github", "crates/rastro-core", "crates/rastro-storage-sqlite", "crates/rastro-cli", "crates/rastro-connector-github", "crates/rastro-operations", "crates/rastro-connector-linear", "crates/rastro-connector-slack", "crates/rastro-extractor-linear", "crates/rastro-extractor-slack", "crates/rastro-adapter-claude-code", "crates/rastro-adapter-codex", "crates/rastro-adapter-pi", "crates/rastro-action-linear", "crates/rastro-adapter-decision"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
schemars = { version = "1", features = ["chrono04"] }

# Size and complexity lints every member inherits with `[lints] workspace = true`. They run at
# clippy's own thresholds, tests included; a function over a limit carries an `#[expect]` with its
# reason, so the expectation fails once the function is fixed and the debt leaves with it.
[workspace.lints.clippy]
too_many_lines = "warn"
cognitive_complexity = "warn"
too_many_arguments = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"

# Dev builds keep only line tables for workspace crates and drop debug info for dependencies.
# Full debug info is most of `target/`, and every worktree builds its own; line tables still give
# backtraces and panics their file and line.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
