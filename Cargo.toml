[workspace]
members = ["crates/rastro-plugin-sdk", "crates/rastro-test-connector", "crates/rastro-core", "crates/rastro-storage-sqlite", "crates/rastro-cli", "crates/rastro-connector-github"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
