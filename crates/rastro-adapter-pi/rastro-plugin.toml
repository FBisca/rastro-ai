id = "rastro-adapter-pi"
name = "Rastro Pi adapter"
version = "0.1.0"
author = "Rastro"
kinds = ["agent-tool-adapter"]
protocol = 1
command = "rastro-adapter-pi"
triggers = []
dependencies = []
# It lets pi do the judgment. The declaration names capabilities, never a tool.
agent_tool = { capabilities = ["judge_text"] }
# The lockdown kit the adapter re-applies on every turn: --no-tools, --no-mcp, and no setting
# source (--no-extensions, --no-skills, --no-prompt-templates, --no-themes, --no-context-files,
# --no-approve, a fixed --system-prompt and an empty --append-system-prompt). tools_off is
# declared only because the live contract test proved it on the installed pi (tests/live.rs,
# ADR-0016 §6).
enforcement = ["tools_off", "no_mcp_servers", "no_setting_sources"]

[permissions]
submit = []
scopes = []
env = ["RASTRO_PI_COMMAND", "RASTRO_PI_MODEL", "RASTRO_HOME", "XDG_DATA_HOME", "ANTHROPIC_API_KEY", "OPENAI_API_KEY", "GEMINI_API_KEY"]
actions = []
