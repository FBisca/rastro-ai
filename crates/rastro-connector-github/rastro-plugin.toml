id = "github"
name = "Rastro GitHub connector"
version = "0.1.0"
author = "Rastro"
kinds = ["connector"]
protocol = 1
command = "rastro-connector-github"
triggers = []
dependencies = []
# Every GitHub source is bound to this extractor.
default_extractor = "rastro-extractor-github"

[permissions]
submit = ["issue", "pull_request", "comment"]
# Both scopes, so the owner chooses per source which one the repo belongs to.
scopes = ["personal", "work"]
env = ["GH_TOKEN", "GITHUB_TOKEN", "GH_HOST", "GH_CONFIG_DIR", "XDG_CONFIG_HOME", "RASTRO_GITHUB_API_URL"]
actions = []

[[source_options]]
name = "repo"
required = true
pattern = "[^/\\s]+/[^/\\s]+"
help = "Repository as owner/repository"
