[package]
name = "rastro-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "rastro"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap = { version = "4", features = ["derive"] }
rastro-core = { path = "../rastro-core" }
rastro-operations = { path = "../rastro-operations" }
rastro-storage-sqlite = { path = "../rastro-storage-sqlite" }
rmcp = { version = "3.8.0", default-features = false, features = ["server", "transport-io"] }
serde_json.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
toml.workspace = true
rusqlite = { version = "0.38", features = ["bundled"] }
jsonschema = { version = "0.33", default-features = false }
