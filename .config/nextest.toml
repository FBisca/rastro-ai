# Rastro's nextest configuration: the suite runs one process per test, a hung test fails its run
# instead of holding it, every failure of a run is kept, and the live tests run alone on request. See
# docs/adr/0013-cargo-nextest-runs-the-tests.md and docs/development.md.
#
# The checks, CI and the selector run the default profile; scripts/nextest-config.test.sh proves it.
# scripts/ignored-tests.test.sh proves the live profile and the ignore-reason gate.

[profile.default]
# A test running past 20 seconds is reported SLOW, and three periods in a row terminate it at 60
# seconds: a test that hangs fails the run with its name instead of waiting on the toolchain's limit.
slow-timeout = { period = "20s", terminate-after = 3 }
# One report holds every failure: the run keeps going after the first one, the JUnit report lists them
# all, and the recorded run reruns them all.
fail-fast = false
# A failure is a failure: a test that only passes on a retry is a flake to fix, not to hide.
retries = 0

[profile.default.junit]
# Relative to the target directory, so the report of a run lands at target/nextest/<profile>/junit.xml.
path = "junit.xml"
store-success-output = false
store-failure-output = true

# The live tests: the ignored ones, which talk to a real service or read a copy of the owner's data, so
# only the owner's machine can run them, one run at a time, with a network's patience. The live run is
# one command, and this profile is half of it:
#
#   cargo nextest run --profile live --run-ignored only
#
# nextest reads the selection from the flag, so the command carries both: the flag picks the ignored
# tests and the profile gives that run its own JUnit report under target/nextest/live/ and a network's
# timeouts. Neither half alone is the live run.
[profile.live]
# A live test waits on a network and on the owner's database before it asserts anything.
slow-timeout = { period = "120s", terminate-after = 2 }
fail-fast = false
retries = 0

[profile.live.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true
